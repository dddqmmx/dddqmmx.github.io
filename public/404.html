<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PaulPerkenstein</title>
    <!--
      GitHub Pages serves this file for any unknown path. It stashes the
      requested path into a query string and redirects to the SPA root, where
      index.html restores it before the router boots. See rafgraph/spa-github-pages.
    -->
    <script>
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          '/?/' +
          l.pathname.slice(1).replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
